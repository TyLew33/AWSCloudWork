AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  ValidateMissionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      Runtime: python3.13
      CodeUri: ValidateMissionFunction
      Policies:
      - AWSLambdaBasicExecutionRole
    Metadata:
      SamResourceId: ValidateMissionFunction
  CompleteMissionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      Runtime: python3.13
      CodeUri: CompleteMissionFunction
      Policies:
      - AWSLambdaBasicExecutionRole
    Metadata:
      SamResourceId: CompleteMissionFunction
  MissionStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: ../../statemachine/mission.asl.json
      DefinitionSubstitutions:
        ValidateMissionFunctionArn:
          Fn::GetAtt:
          - ValidateMissionFunction
          - Arn
        CompleteMissionFunctionArn:
          Fn::GetAtt:
          - CompleteMissionFunction
          - Arn
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: ValidateMissionFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: CompleteMissionFunction
