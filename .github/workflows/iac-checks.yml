name: IaC checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: tofu fmt check
        run: tofu fmt -check -recursive

      - name: tofu init/validate per stage
        run: |
          set -euo pipefail
          dirs=(
            aws-tgw-dxgw-vpc-PROJECT/0*/
            aws-asg/
            rds_tofu_lab/
            s3/iac/Terraform/
          )
          for dir in "${dirs[@]}"; do
            for stage in $dir; do
              stage="${stage%/}"
              if [[ "$(basename "$stage")" == "04_security" ]]; then
                echo "Skipping $stage (child module, no standalone provider config)"
                continue
              fi
              echo "=== $stage ==="
              (cd "$stage" && tofu init -backend=false && tofu validate)
            done
          done

      - name: tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Run tflint
        run: tflint --chdir=aws-tgw-dxgw-vpc-PROJECT --recursive

      - name: Run checkov
        uses: bridgecrewio/checkov-action@master
        continue-on-error: true
        with:
          directory: aws-tgw-dxgw-vpc-PROJECT
          quiet: true

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          shellcheck s3/bash-scripts/* vpc/basics/* s3/iac/cfn/deploy s3/iac/cfn/delete-stack
