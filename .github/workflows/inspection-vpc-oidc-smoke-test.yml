on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whoami:
    name: Who does AWS think I am?
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # REQUIRED. Without it, the token request fails outright.

    steps:
      - name: Assume the plan role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_INSPECTION_PLAN_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: gha-inspection-smoke

      - name: Confirm identity
        run: aws sts get-caller-identity

      - name: Confirm we can reach the state bucket
        run: aws s3 ls s3://inspection-vpc-tfstate-bucket/inspection-vpc-project/
EOF
