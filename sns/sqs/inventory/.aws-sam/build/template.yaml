AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  InventoryProcessor:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: InventoryProcessor
      Runtime: python3.13
      Handler: app.lambda_handler
      CodeUri: InventoryProcessor
      MemorySize: 128
      Timeout: 10
      Policies:
      - AWSLambdaSQSQueueExecutionRole
    Metadata:
      SamResourceId: InventoryProcessor
